<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>붉은 눈 · 디펜스판</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#0d0f11}iframe{display:block}</style>
<script src="./game-navigation.js"></script></head>
<body><iframe title="붉은 눈 디펜스판" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
const game=document.querySelector('iframe');
game.addEventListener('load',()=>{
  const doc=game.contentDocument;
  if(!doc.getElementById('startScreen'))return;
  installGameNavigation(doc,'defense');
  const ranks=doc.createElement('script');
  ranks.src='./defense-ranking.js';
  doc.body.append(ranks);
});
game.src='./defense-game.html';
</script></body></html>
