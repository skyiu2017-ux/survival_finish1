<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>붉은 눈 · 바스토뉴 기차역</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191b20;color:#e8ece8;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:12px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font:bold clamp(19px,4vw,28px) Georgia,serif;margin:0}output{color:#f6d591;font:bold 16px monospace}canvas{display:block;width:100%;height:auto;margin:10px 0;border:1px solid #50616a;background:#263941;touch-action:none;user-select:none}p{margin:4px 0 12px;color:#d2dedc}button{padding:9px 18px;color:#152329;background:#dfc49a;border:0;border-radius:4px;font-weight:bold;cursor:pointer;touch-action:none;user-select:none}button.secondary{background:#394b53;color:white}button:focus-visible{outline:3px solid white}
</style><main><header><h1>바스토뉴 기차역</h1><output id="hud"></output></header><canvas width="900" height="300" aria-label="눈 덮인 바스토뉴역 승강장. 터치 또는 스페이스바로 점프"></canvas><p id="message" role="status"></p><footer><button id="action"></button><button id="leave" class="secondary" hidden>자동 탐색으로 전환</button></footer></main>
<script>
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const hud=document.querySelector('#hud'), message=document.querySelector('#message'), action=document.querySelector('#action'), leave=document.querySelector('#leave');
const embedded=parent!==window, ground=261, playerX=122, duration=20;
const locations={"crypt": "성당 지하 납골당", "barn": "외딴 농가 헛간", "cabin": "숲속 사냥꾼 오두막", "bakery": "마을 빵집", "mill": "강가의 제재소", "station": "바스토뉴 기차역", "wreck": "불탄 독일군 반궤도 차량", "depot": "버려진 미군 보급소", "aid": "미군 야전 구호소"};
const requested=new URLSearchParams(location.search).get('place');
const place=Object.hasOwn(locations,requested)?requested:'station';
const placeName=locations[place];
document.querySelector('h1').textContent=placeName;
document.title='붉은 눈 · '+placeName;
canvas.setAttribute('aria-label',placeName+' 직접 탐색. 터치 또는 스페이스바로 점프');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const background=new Image(), atlas=new Image();
const sprites={"run0": [0, 0, 35, 48], "run1": [152, 0, 38, 49], "run2": [304, 0, 39, 49], "run3": [456, 0, 38, 48], "walk0": [608, 0, 29, 44], "walk1": [760, 0, 31, 45], "fast0": [912, 0, 45, 39], "fast1": [1064, 0, 42, 38], "big0": [1216, 0, 50, 57], "big1": [1368, 0, 43, 56], "wire": [1520, 0, 141, 46], "truck": [1672, 0, 146, 74], "drums": [1824, 0, 78, 42], "ruin": [1976, 0, 108, 91], "pine": [2128, 0, 69, 104], "window": [2280, 0, 119, 94], "door": [2432, 0, 72, 77], "pile": [2584, 0, 75, 47], "tower": [2736, 0, 62, 105], "sand": [2888, 0, 153, 47]};
const kinds=[
  {id:'drums',w:48,h:32},{id:'wire',w:75,h:30},{id:'ruin',w:55,h:46},
  {id:'truck',w:89,h:46},{id:'walk',w:35,h:54},{id:'fast',w:47,h:37},{id:'big',w:45,h:65}
];
// Each three-obstacle phrase fits the longest jump plus a recovery interval.
const count=22;
const props={crypt:['ruin','drums'],barn:['pile','drums'],cabin:['pile','ruin'],bakery:['drums','ruin'],mill:['pile','drums'],station:['truck','wire','drums'],wreck:['truck','wire','ruin'],depot:['sand','drums','truck'],aid:['sand','wire','drums']};
kinds.push({id:'pile',w:59,h:32},{id:'sand',w:71,h:26});
function makeCourse(){
 const pool=props[place],pick=list=>list[Math.floor(Math.random()*list.length)];
 let at=1.30,phrase=[];
 return Array.from({length:count},(_,i)=>{
   if(i%3===0)phrase=pick([[.78,.81,1.01],[.81,.76,1.03],[.76,.86,.98]]);
   const id=i%3===1?pick(['fast','walk','big']):pick(pool);
   const obstacle={kind:kinds.findIndex(k=>k.id===id),at,hit:false,passed:false};
   at+=phrase[i%3];return obstacle;
 });
}
let best=0,impactAt=-10;
const bestKey='rs-explore-best-v1-'+place;
try{best=Math.max(0,Math.min(count,Number(localStorage.getItem(bestKey))||0));}catch{}
const distance=t=>323*t+3.5*t*t;
let mode,time,height,velocity,held,airtime,clears,obstacles,last,frame,reported;
function bonus(){return clears>=15?2:clears>=7?1:0;}
function reset(){
 mode='ready';time=height=velocity=airtime=clears=0;held=reported=false;last=null;
 impactAt=-10;obstacles=makeCourse();
 message.textContent='짧게 누르면 낮은 점프 · 꾹 누르면 높은 점프   |   7개 통과 +1 · 15개 통과 +2'+(best?' · 이 장소 최고 '+best+'개':'');
 action.textContent='도전 시작';leave.hidden=!embedded;draw();
}
function jump(){
 if(mode!=='run'||height>0||held)return;
 held=true;velocity=484;airtime=0;height=.01;
}
function release(){
 if(held&&velocity>315)velocity=315;
 held=false;
}
function start(){mode='run';action.textContent='점프';last=null;frame=requestAnimationFrame(tick);}
function press(){if(mode==='ready')start();else jump();}
function finish(){
 mode='end';held=false;
 const improved=clears>best;
 best=Math.max(best,clears);
 try{localStorage.setItem(bestKey,String(best));}catch{}
 message.textContent=count+'개 중 '+clears+'개 통과 · '+(improved?'새 최고 기록':'장소 최고 '+best+'개')+' · 추가 보급 +'+bonus();
 action.textContent=embedded?(bonus()?'귀환 · 보급품 선택':'귀환'):'다시 도전';leave.hidden=true;
}
function send(value){if(reported)return;reported=true;cancelAnimationFrame(frame);parent.postMessage({type:'station-complete',bonus:value},'*');}
leave.onclick=()=>send(0);
action.onclick=e=>{
 if(mode==='end'){if(embedded)send(bonus());else reset();}
 else if(mode==='ready')start();
 else if(e.detail===0){jump();release();}
};
function bindSurface(el){
 el.addEventListener('pointerdown',e=>{
   if(!e.isPrimary||e.button!==0||mode==='end')return;
   if(el===action&&mode==='ready')return;
   e.preventDefault();el.setPointerCapture(e.pointerId);press();
 });
 for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,release);
}
bindSurface(canvas);bindSurface(action);
window.addEventListener('keydown',e=>{if(e.code==='Space'&&mode!=='end'&&document.activeElement!==leave){e.preventDefault();if(!e.repeat)press();}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){release();}});
window.addEventListener('blur',release);
document.addEventListener('visibilitychange',()=>{release();last=null;});
function step(dt){
 time=Math.min(duration,time+dt);
 if(height>0){
   airtime+=dt;velocity-=(held&&velocity>0&&airtime<=.22?930:1810)*dt;
   height=Math.max(0,height+velocity*dt);
   if(height===0)velocity=0;
 }
 for(const o of obstacles){
   const k=kinds[o.kind],dx=distance(o.at)-distance(time);
   if(!o.passed&&!o.hit&&Math.abs(dx)<k.w*.37+7&&height<k.h*.88){o.hit=true;impactAt=time;}
   if(!o.passed&&dx+k.w/2< -9){o.passed=true;if(!o.hit)clears++;}
 }
}
function tick(now){
 if(mode!=='run')return;
 let dt=last===null?0:Math.min(.12,(now-last)/1000);last=now;
 while(dt>0){const slice=Math.min(.008,dt);step(slice);dt-=slice;}
 if(time>=duration)finish();draw();if(mode==='run')frame=requestAnimationFrame(tick);
}
function sprite(id,x,y,w,h,mirror=false){
 if(!atlas.naturalWidth)return;
 ctx.save();ctx.translate(Math.round(x),Math.round(y));if(mirror)ctx.scale(-1,1);
 ctx.drawImage(atlas,...sprites[id],-w/2,-h,w,h);ctx.restore();
}
function shadow(x,y,w){ctx.fillStyle='rgba(48,49,54,.38)';ctx.beginPath();ctx.ellipse(x,y,w,3,0,0,Math.PI*2);ctx.fill();}
function draw(){
 const d=distance(time),W=canvas.width,H=canvas.height;
 const age=time-impactAt, recoil=Math.max(0,1-age/.38), shake=reducedMotion.matches?0:Math.max(0,1-age/.20);
 ctx.save();ctx.translate(6*shake*Math.cos(age*121),3*shake*Math.sin(age*154));
 ctx.imageSmoothingEnabled=true;ctx.fillStyle='#6a737a';ctx.fillRect(0,0,W,H);
 if(background.naturalWidth){
   const pan=d*.24%1000;
   ctx.drawImage(background,-pan,0);ctx.drawImage(background,1000-pan,0);
   // Snow and platform edge travel with the runner; the distant siding moves slowly.
   const near=d%1000;
   for(const offset of [-near,1000-near])ctx.drawImage(background,0,245,1000,55,offset,245,1000,55);
 }
 const beat=Math.floor(time*7)%2;
 for(const o of obstacles){
  const k=kinds[o.kind],x=playerX+distance(o.at)-d;if(x< -80||x>W+90)continue;
  const infected=o.kind>=4 && o.kind<=6;shadow(x,ground,k.w*.42);ctx.save();if(o.hit)ctx.globalAlpha=.53;
  sprite(infected?k.id+beat:k.id,x,ground-(infected?beat:0),k.w,k.h,infected);ctx.restore();
 }
 const foot=ground-height;
 ctx.save();ctx.translate(playerX-12*recoil,foot);ctx.rotate(-.32*recoil);
 ctx.scale(1+.1*recoil,1-.22*recoil);
 sprite('run'+(recoil>.2?0:height>0?2:Math.floor(time*10)%4),0,0,45,60);
 ctx.restore();
 if(recoil>0){
   ctx.fillStyle='rgba(244,213,158,'+recoil+')';
   for(let i=0;i<9;i++){const angle=i*.62-2.7,r=6+age*(55+i*6);ctx.fillRect(playerX+8+Math.cos(angle)*r,foot-24+Math.sin(angle)*r,3,2);}
 }
 if(place!=='crypt')for(let i=0;i<42;i++){const x=((i*193-time*(22+i%9))%W+W)%W,y=(i*73+time*(16+i%11))%H;ctx.fillStyle='rgba(240,238,223,.48)';ctx.fillRect(x,y,2,2);}
 ctx.restore();
 if(recoil>0){ctx.strokeStyle='rgba(194,100,73,'+recoil*.78+')';ctx.lineWidth=6;ctx.strokeRect(2,2,W-4,H-4);}
 hud.textContent=(duration-time).toFixed(1)+'초 · 통과 '+clears+'/'+count+(mode==='run'?(clears<7?' · 보급까지 '+(7-clears):clears<15?' · 두 번째 보급까지 '+(15-clears):' · 보급 +2 확보'):'');
}
background.onload=atlas.onload=draw;background.src=place==='station'?'assets/bastogne-platform.webp':'assets/explore-'+place+'.webp';atlas.src='assets/station-sprites.webp';reset();
</script></html>
